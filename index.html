<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园 Wiki</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav-wrap" aria-label="主导航">
      <a class="brand" href="#" data-page="home">校园 Wiki</a>
      <button class="nav-link is-active" type="button" data-page="home">首页</button>
      <button class="nav-link" type="button" data-page="cas">CAS 项目库</button>
      <button class="nav-link" type="button" data-page="resources">资源中心</button>
    </nav>
  </header>

  <main>
    <section class="page is-active" id="home-page" data-page-panel="home">
      <div class="home-card">
        <h1>欢迎来到校园 Wiki</h1>
        <p>浏览校园论坛、CAS 系统、年鉴、活动照片和各类学习生活资源。</p>
        <div class="portal-grid" aria-label="入口导航">
          <button class="portal-card" type="button" data-page="forum">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
            </span>
            <strong>校园论坛</strong>
            <span>交流学习生活</span>
          </button>
          <button class="portal-card" type="button" data-page="cas">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 14h4"/><path d="M8 18h8"/></svg>
            </span>
            <strong>CAS 项目库</strong>
            <span>统一身份认证</span>
          </button>
          <button class="portal-card" type="button" data-page="resources">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>
            </span>
            <strong>资源中心</strong>
            <span>年鉴与常用资料</span>
          </button>
          <button class="portal-card" type="button" data-page="resources">
            <span class="icon-box" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>
            </span>
            <strong>活动照片</strong>
            <span>资源中心板块</span>
          </button>
        </div>
      </div>
    </section>

    <section class="page" id="resources-page" data-page-panel="resources">
      <div class="content-layout">
        <aside class="filter-card">
          <h2>资源筛选</h2>
          <label class="resource-control">
            <span>关键词</span>
            <span class="input-shell">
              <input id="resource-search" type="search" placeholder="搜索名称、内容、简介">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg>
            </span>
          </label>
          <label class="resource-control">
            <span>年份</span>
            <select id="resource-year">
              <option value="all">全部年份</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
            </select>
          </label>
          <label class="resource-control">
            <span>排序</span>
            <select id="resource-sort">
              <option value="hot">最热</option>
              <option value="new">最新</option>
              <option value="download">下载最多</option>
              <option value="old">最早</option>
            </select>
          </label>
          <div class="filter-group icon-filter-group">
            <h3>资源类型</h3>
            <button class="filter-option is-selected" type="button" data-resource-category="all">
              <span class="mini-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M14 14h6v6h-6z"/></svg></span>
              全部资源
            </button>
            <button class="filter-option" type="button" data-resource-category="yearbook">
              <span class="mini-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4.5A2.5 2.5 0 0 1 8.5 2H20v18H8.5A2.5 2.5 0 0 0 6 22V4.5z"/><path d="M6 4.5A2.5 2.5 0 0 0 3.5 2H3v18h.5A2.5 2.5 0 0 1 6 22"/><path d="M10 7h6"/><path d="M10 11h4"/></svg></span>
              Yearbook
            </button>
            <button class="filter-option" type="button" data-resource-category="photos">
              <span class="mini-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-5-5L5 19"/></svg></span>
              活动照片
            </button>
            <button class="filter-option" type="button" data-resource-category="other">
              <span class="mini-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M3 7V6a3 3 0 0 1 3-3h4l2 4"/></svg></span>
              其他资源
            </button>
          </div>

          <div class="photo-controls" id="photo-controls">
            <h2>照片筛选</h2>
                <label>
                  <span>搜索</span>
                  <span class="input-shell">
                    <input id="photo-search" type="search" placeholder="搜索活动名称">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg>
                  </span>
                </label>
                <label>
                  <span>年份</span>
                  <select id="photo-year">
                    <option value="all">全部年份</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                  </select>
                </label>
                <label>
                  <span>排序</span>
                  <select id="photo-sort">
                    <option value="hot">最热</option>
                    <option value="new">最新</option>
                    <option value="photoCount">照片最多</option>
                    <option value="old">最早</option>
                  </select>
                </label>
                <div class="filter-group" id="activity-list">
                  <h3>选择活动</h3>
                </div>
          </div>
        </aside>

        <div class="main-column">
          <div class="resource-view" id="resource-view">
            <div class="section-banner align-left">
              <h1>资源中心</h1>
              <p>按年鉴、活动照片和其他资源分类查看校园资料，支持关键词筛选与热度排序。</p>
            </div>
            <div class="resource-grid" id="resource-grid"></div>
          </div>

          <div class="photo-view" id="photo-view" aria-label="活动照片">
            <div class="photo-toolbar" id="photo-intro"></div>
            <div class="photo-grid" id="photo-grid" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="cas-page" data-page-panel="cas">
      <div class="single-card">
        <h1>CAS 项目库</h1>
        <p>统一身份认证项目资料整理中，可从资源中心查看 CAS 使用指南。</p>
      </div>
    </section>

    <section class="page" id="forum-page" data-page-panel="forum">
      <div class="single-card">
        <h1>校园论坛</h1>
        <p>校园话题、活动招募与学习经验交流入口。</p>
      </div>
    </section>
  </main>

  <div class="photo-modal" id="photo-modal" aria-hidden="true" role="dialog" aria-label="照片详情">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel">
      <div class="modal-actions">
        <div>
          <h2 id="modal-title">照片详情</h2>
          <p id="modal-meta"></p>
        </div>
        <div class="modal-buttons">
          <a class="download-button" id="modal-download" href="#" download>Download</a>
          <button class="icon-button" type="button" aria-label="关闭" data-close-modal>
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>
      <img id="modal-image" src="" alt="">
    </section>
  </div>

  <button class="help-button" type="button" aria-label="帮助">?</button>
  <script src="script.js"></script>
</body>
</html>
